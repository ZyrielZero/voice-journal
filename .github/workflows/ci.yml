name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # EmbeddingEngineTest runs real ONNX inference on the JVM against the
      # bundled model, so the models must exist before the test task. The key
      # is the pinned checksum file, so the cache changes exactly when a model
      # does; the fetch script re-verifies every file even on a cache hit, so
      # a corrupt cached file is replaced instead of kept forever.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-${{ hashFiles('scripts/models.sha256') }}

      - name: Fetch and verify models
        run: bash scripts/fetch-models.sh

      # The runner image ships an Android SDK; pin the exact NDK and CMake
      # the project builds against (16 KB page alignment depends on r28).
      # Cached on the versions so sdkmanager only runs on a miss. The runner's
      # ANDROID_HOME is a shell variable, not in the env context, so export it.
      - name: Resolve SDK path
        run: echo "SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache NDK and CMake
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.SDK_ROOT }}/cmake/${{ env.CMAKE_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}

      - name: Install pinned NDK and CMake
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # Wall-clock assertions in BenchTest are off by default (shared runners
      # are too noisy); pass -Pvj.perfAssertions=true locally to enable them.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Lint errors fail the build; warnings are reported only.
      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # Builds unsigned (no keystore.properties in CI) with R8 enabled. This
      # proves keep rules and the native -O3 build compile and shrink cleanly
      # on every push, and produces the APK and the AAB Play needs so a CI
      # build can be compared with a store build. Runtime behavior still
      # needs a device.
      - name: Assemble release APK and bundle (unsigned, R8)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # The promise on the front page, checked on the artifact itself: the
      # APK must not request any network permission. Gradle's verifyNoNetwork
      # task checks the merged manifest; this checks what was actually built.
      - name: APK requests no network permission
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -E "INTERNET|NETWORK_STATE|WIFI_STATE" permissions.txt; then
            echo "The APK requests a network permission"; exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  # Room migration tests need a real SQLite, so they run on an emulator.
  # The emulator is x86_64 and the app's native library is arm64-only, so
  # this build leaves whisper out (-Pvj.skipNative=true); the migration
  # tests never load it. KVM is enabled first: without hardware
  # acceleration the emulator takes longer to boot than the job allows.
  #
  # continue-on-error until this job has gone green once on this repo: it
  # was added without a runner to try it on. Remove that line after the
  # first green run so a broken migration fails the build.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The app module packages the models as assets, so they must exist
      # even though these tests do not read them.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-${{ hashFiles('scripts/models.sha256') }}

      - name: Fetch and verify models
        run: bash scripts/fetch-models.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Migration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pvj.skipNative=true --stacktrace

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/

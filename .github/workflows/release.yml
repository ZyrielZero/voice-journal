name: Release

# Builds a signed release APK and publishes it to a GitHub release whenever a
# version tag (v1.1.0, v1.2.0, ...) is pushed.
#
# Required repository secrets:
#   KEYSTORE_BASE64     base64 of the release .jks file
#   KEYSTORE_PASSWORD   store password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
#
# The signing certificate is pinned below. A build signed with any other key
# fails instead of shipping an APK that cannot update existing installs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS: 36.0.0
  CERT_SHA256: e6be235505cece28cfc87abc5508469efa0da1295e253d8e70f8f35cc428eee5

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$name" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $name"; exit 1
          fi

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-${{ hashFiles('scripts/models.sha256') }}

      - name: Fetch and verify models
        run: bash scripts/fetch-models.sh

      - name: Resolve SDK path
        run: echo "SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache NDK and CMake
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.SDK_ROOT }}/cmake/${{ env.CMAKE_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}

      - name: Install pinned NDK, CMake and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "build-tools;$BUILD_TOOLS" > /dev/null

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature and rename
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$signer" verify --print-certs "$apk" | tee certs.txt
          grep -q "certificate SHA-256 digest: $CERT_SHA256" certs.txt || {
            echo "APK is not signed with the pinned release certificate"; exit 1; }
          out="voice-journal-${GITHUB_REF_NAME#v}.apk"
          mv "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="fastlane/metadata/android/en-US/changelogs/$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts).txt"
          [ -f "$notes" ] || notes=/dev/null
          {
            cat "$notes"
            echo
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Voice Journal ${GITHUB_REF_NAME#v}" --notes-file release-notes.md

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
